name: Foundation contracts and mobile builds
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy,llvm-tools-preview
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: python3 tools/test_f1_crypto_runtime.py
      - run: python3 tools/test_f1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f1-storage-recovery
          path: |
            artifacts/f1-recovery.json
            artifacts/f1-crypto-runtime.json
            artifacts/f1-crypto-runtime-tests.txt
          retention-days: 14
      - run: python3 tools/check_contracts.py
      - run: flutter pub get --enforce-lockfile
        working-directory: platforms/mesh_host
      - run: python3 -m unittest discover -s tools/tests -v
      - run: python3 tools/check_pigeon.py
      - run: flutter analyze
        working-directory: platforms/mesh_host
      - run: flutter pub get --enforce-lockfile && flutter analyze && flutter test --coverage
        working-directory: app
      - run: flutter pub get --enforce-lockfile && flutter analyze && flutter test --coverage
        working-directory: packages/mesh_field_sdk
      - run: cargo install cargo-llvm-cov --locked
      - run: cargo llvm-cov --workspace --locked --lcov --output-path artifacts/coverage/rust.lcov
      - name: Enforce 90% coverage on new Rust and Dart code
        if: github.event_name == 'pull_request'
        run: >-
          python3 tools/check_new_code_coverage.py
          --base "${{ github.event.pull_request.base.sha }}"
          --rust-lcov artifacts/coverage/rust.lcov
          --flutter-lcov app/coverage/lcov.info
          --flutter-lcov packages/mesh_field_sdk/coverage/lcov.info
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: |
            artifacts/coverage/rust.lcov
            app/coverage/lcov.info
            packages/mesh_field_sdk/coverage/lcov.info
          retention-days: 14
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools cmdline-tools;latest'
      - run: rustup toolchain install 1.98.1 --profile minimal
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager 'ndk;28.2.13676358'
      - run: python3 tools/build_native.py android
      - run: cargo build --locked -p mesh-ffi-jni
      - run: flutter pub get --enforce-lockfile && flutter build apk --debug --target-platform android-arm64,android-x64
        working-directory: app
      - run: ./gradlew :mesh_host:testDebugUnitTest :mesh_host:assembleRelease --console=plain
        working-directory: app/android
      - run: python3 tools/evidence.py
      - uses: actions/upload-artifact@v4
        with:
          name: android-foundation
          path: |
            app/build/app/outputs/flutter-apk/*.apk
            app/build/mesh_host/outputs/aar/*.aar
            app/build/mesh_host/test-results/
            artifacts/
          retention-days: 14
  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: rustup toolchain install 1.98.1 --profile minimal
      - run: python3 tools/build_native.py apple
      - run: sh tools/test_apple_host.sh
      - run: flutter pub get --enforce-lockfile && flutter build ios --simulator --debug
        working-directory: app
      - name: Boot an available iPhone simulator
        run: |
          python3 - <<'PY'
          import json, subprocess, os
          devices=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','--json']))
          chosen=next(d for group in devices['devices'].values() for d in group if d['name'].startswith('iPhone'))
          if chosen['state'] != 'Booted': subprocess.run(['xcrun','simctl','boot',chosen['udid']],check=True)
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('MESH_SIMULATOR='+chosen['udid']+'\n')
          PY
      - run: flutter test integration_test/native_bridge_test.dart -d "$MESH_SIMULATOR"
        working-directory: app
      - run: flutter build ios --release --no-codesign
        working-directory: app
      - run: python3 tools/evidence.py
      - uses: actions/upload-artifact@v4
        with:
          name: apple-foundation
          path: |
            platforms/mesh_host/ios/mesh_host/MeshEngine.xcframework/
            artifacts/
          retention-days: 14
