[package]
name = "mesh-store"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
fault-injection = []

[dependencies]
mesh-types = { path = "../mesh-types" }
mesh-object = { path = "../mesh-object" }
# Android does not expose a stable system libcrypto for SQLCipher. Bundle its
# crypto provider so the encrypted store has the same implementation on both hosts.
rusqlite = { version = "=0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
zeroize = "=1.8.2"
mesh-protocol = { path = "../mesh-protocol" }
mesh-replication = { path = "../mesh-replication" }
mesh-crypto = { path = "../mesh-crypto" }

[dev-dependencies]
mesh-codec = { path = "../mesh-codec" }
mesh-runtime = { path = "../mesh-runtime" }
mesh-session = { path = "../mesh-session" }
