name: Rust dependency policy
on:
  pull_request:
    paths: ['Cargo.lock', '**/Cargo.toml', 'deny.toml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
