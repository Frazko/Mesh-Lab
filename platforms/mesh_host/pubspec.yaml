name: mesh_host
description: Typed Flutter facade for the native Mesh Lab diagnostic runtime.
version: 0.1.0
publish_to: none
environment:
  sdk: ^3.13.2
  flutter: '>=3.47.2'
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  pigeon: 28.1.0
flutter:
  plugin:
    platforms:
      android:
        package: com.frazko.mesh_host
        pluginClass: MeshHostPlugin
      ios:
        pluginClass: MeshHostPlugin
